<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <!-- Tailwind CSS via CDN (browser build) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div id="calculator" class="bg-white rounded-xl shadow-lg p-6 w-80">
    <input id="display" type="text" readonly
      class="w-full text-right text-3xl bg-gray-50 rounded-md p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      placeholder="0">
    <div class="grid grid-cols-4 gap-3">
      <!-- Row 1 -->
      <button data-action="clear" class="calc-btn bg-red-500 hover:bg-red-600 text-white">C</button>
      <button data-action="backspace" class="calc-btn bg-gray-300 hover:bg-gray-400 text-gray-800">←</button>
      <button data-action="percent" class="calc-btn bg-gray-300 hover:bg-gray-400 text-gray-800">%</button>
      <button data-action="operator" data-value="/" class="calc-btn bg-indigo-500 hover:bg-indigo-600 text-white">÷</button>
      <!-- Row 2 -->
      <button data-action="number" data-value="7" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">7</button>
      <button data-action="number" data-value="8" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">8</button>
      <button data-action="number" data-value="9" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">9</button>
      <button data-action="operator" data-value="*" class="calc-btn bg-indigo-500 hover:bg-indigo-600 text-white">×</button>
      <!-- Row 3 -->
      <button data-action="number" data-value="4" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">4</button>
      <button data-action="number" data-value="5" class="calc-btn bg-gray-200 hover:bg-gray-3 text-gray-800">5</button>
      <button data-action="number" data-value="6" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">6</button>
      <button data-action="operator" data-value="-" class="calc-btn bg-indigo-500 hover:bg-indigo-600 text-white">−</button>
      <!-- Row 4 -->
      <button data-action="number" data-value="1" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">1</button>
      <button data-action="number" data-value="2" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">2</button>
      <button data-action="number" data-value="3" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">3</button>
      <button data-action="operator" data-value="+" class="calc-btn bg-indigo-500 hover:bg-indigo-600 text-white">+</button>
      <!-- Row 5 -->
      <button data-action="number" data-value="0" class="calc-btn col-span-2 bg-gray-200 hover:bg-gray-300 text-gray-800">0</button>
      <button data-action="decimal" class="calc-btn bg-gray-200 hover:bg-gray-300 text-gray-800">.</button>
      <button data-action="equals" class="calc-btn bg-green-500 hover:bg-green-600 text-white">=</button>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
