<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Age Calculator</h1>

        <div class="mb-6">
            <label for="birthDate" class="block text-gray-700 text-sm font-semibold mb-2">Enter your Birth Date:</label>
            <input type="date" id="birthDate" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button id="calculateAgeBtn" class="w-full bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 font-semibold text-lg transition duration-200">
            Calculate Age
        </button>

        <div id="result" class="mt-8 p-4 bg-blue-50 border-l-4 border-blue-400 text-blue-800 rounded-md hidden">
            <p class="font-semibold text-lg mb-2">Your Age Is:</p>
            <p id="ageDisplay" class="text-2xl font-bold"></p>
        </div>

        <div id="error" class="mt-4 p-3 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-md hidden">
            <p id="errorMessage" class="font-medium"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
