<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>perfectcirclechallenge</title>
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-['Plus_Jakarta_Sans',sans-serif] select-none touch-none overflow-hidden">
  
  <!-- Ambient background glow elements -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-32 -left-32 w-80 h-80 rounded-full bg-cyan-500/10 blur-[100px]"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 rounded-full bg-purple-600/15 blur-[120px]"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 rounded-full bg-blue-500/5 blur-[130px]"></div>
  </div>

  <!-- Main Container -->
  <div class="relative z-10 flex flex-col h-full flex-1 max-w-lg mx-auto w-full px-4 py-3 justify-between">
    
    <!-- Top Header HUD -->
    <header class="flex items-center justify-between py-2 border-b border-slate-800/80">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="9" stroke-dasharray="2 3"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base font-black tracking-wider uppercase font-['Orbitron',sans-serif] bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 bg-clip-text text-transparent">
            Circle Pro
          </h1>
          <p class="text-[10px] text-slate-400 font-medium tracking-tight">Single-stroke accuracy test</p>
        </div>
      </div>

      <!-- Quick Stats & Audio Toggle -->
      <div class="flex items-center space-x-2">
        <div class="px-2.5 py-1 rounded-full bg-slate-900/90 border border-slate-800 flex items-center space-x-1.5 shadow-inner">
          <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Best:</span>
          <span id="best-score-display" class="text-xs font-bold font-['Orbitron',sans-serif] text-cyan-400">0.0%</span>
        </div>
        
        <button id="sound-btn" class="w-8 h-8 rounded-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-cyan-400 flex items-center justify-center transition-colors active:scale-95" aria-label="Toggle Sound">
          <svg id="sound-icon-on" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
          </svg>
          <svg id="sound-icon-off" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Canvas Interactive Arena -->
    <main class="relative flex-1 flex flex-col items-center justify-center my-2">
      <!-- Drawing Canvas Box -->
      <div id="canvas-card" class="relative w-full aspect-square max-w-[380px] max-h-[380px] rounded-3xl bg-slate-900/60 border border-slate-800/80 p-2 shadow-2xl shadow-cyan-950/20 backdrop-blur-md flex items-center justify-center overflow-hidden">
        
        <!-- Live drawing Canvas -->
        <canvas id="circle-canvas" class="w-full h-full rounded-2xl cursor-crosshair touch-none"></canvas>
        
        <!-- Floating Guidance Overlay (Visible before drawing) -->
        <div id="guide-overlay" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none p-6 text-center transition-opacity duration-300">
          <div class="w-14 h-14 rounded-full border border-cyan-500/30 bg-cyan-500/10 flex items-center justify-center mb-3 animate-pulse">
            <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
            </svg>
          </div>
          <p class="text-sm font-semibold text-slate-200">Draw a circle in one continuous motion</p>
          <p class="text-xs text-slate-400 mt-1 max-w-[220px]">Trace around the center dot without lifting until complete</p>
        </div>

        <!-- In-canvas Real-time Status Floating pill -->
        <div id="status-pill" class="absolute top-4 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-slate-950/80 border border-slate-700/80 text-[11px] font-mono font-medium text-slate-300 opacity-0 transition-all pointer-events-none shadow-md">
          Ready
        </div>
      </div>

      <!-- Live feedback banner under canvas -->
      <div class="w-full max-w-[380px] mt-2 flex items-center justify-between px-2 text-[11px] text-slate-400">
        <span>Attempts: <strong id="attempt-count" class="text-slate-200">0</strong></span>
        <span id="streak-indicator" class="text-cyan-400 font-medium">Draw clockwise or counter-clockwise</span>
      </div>
    </main>

    <!-- Results Modal / Bottom Sheet -->
    <div id="result-drawer" class="w-full max-w-[380px] mx-auto bg-slate-900/95 border border-slate-800 rounded-2xl p-4 shadow-2xl backdrop-blur-xl mb-2 hidden flex-col items-center text-center transform transition-all duration-300">
      <div class="flex items-center justify-between w-full mb-1">
        <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 font-['Orbitron',sans-serif]">Score Result</span>
        <span id="feedback-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wide uppercase bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
          Precision
        </span>
      </div>

      <!-- Score display -->
      <div class="my-1">
        <div class="flex items-baseline justify-center">
          <span id="score-value" class="text-4xl sm:text-5xl font-black font-['Orbitron',sans-serif] bg-gradient-to-b from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent neon-glow">
            0.0
          </span>
          <span class="text-xl font-bold font-['Orbitron',sans-serif] text-cyan-400 ml-1">%</span>
        </div>
        <p id="score-comment" class="text-sm font-semibold text-slate-200 mt-0.5">
          Masterpiece!
        </p>
      </div>

      <!-- Breakdown metrics micro-grid -->
      <div class="grid grid-cols-3 gap-2 w-full my-3 pt-2 border-t border-slate-800/80">
        <div class="bg-slate-950/60 rounded-xl p-1.5 border border-slate-800/60">
          <p class="text-[9px] uppercase tracking-wider text-slate-400">Roundness</p>
          <p id="metric-roundness" class="text-xs font-bold text-slate-200 font-mono">--</p>
        </div>
        <div class="bg-slate-950/60 rounded-xl p-1.5 border border-slate-800/60">
          <p class="text-[9px] uppercase tracking-wider text-slate-400">Closure</p>
          <p id="metric-closure" class="text-xs font-bold text-slate-200 font-mono">--</p>
        </div>
        <div class="bg-slate-950/60 rounded-xl p-1.5 border border-slate-800/60">
          <p class="text-[9px] uppercase tracking-wider text-slate-400">Consistency</p>
          <p id="metric-variance" class="text-xs font-bold text-slate-200 font-mono">--</p>
        </div>
      </div>

      <!-- Toggle overlay / actions -->
      <div class="flex items-center justify-center space-x-2 w-full">
        <button id="toggle-overlay-btn" class="flex-1 py-2 px-3 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 text-xs font-semibold text-slate-200 border border-slate-700 transition-all flex items-center justify-center space-x-1.5 active:scale-95">
          <span id="overlay-state-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span>Show Ideal</span>
        </button>
        <button id="retry-btn-modal" class="flex-1 py-2 px-3 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-xs font-bold text-white shadow-lg shadow-cyan-500/25 transition-all flex items-center justify-center space-x-1 active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Try Again</span>
        </button>
      </div>
    </div>

    <!-- Bottom Controls Footer -->
    <footer class="pt-1 pb-3 flex items-center justify-center">
      <button id="reset-btn" class="w-full max-w-[380px] py-3.5 px-6 rounded-2xl bg-gradient-to-r from-cyan-600 via-blue-600 to-purple-600 hover:from-cyan-500 hover:via-blue-500 hover:to-purple-500 text-white font-bold text-sm tracking-wide shadow-xl shadow-cyan-600/20 flex items-center justify-center space-x-2 transition-all active:scale-98">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span>Reset / Try Again</span>
      </button>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
