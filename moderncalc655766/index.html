<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>moderncalc</title>
  <!-- Tailwind CSS v4 Browser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-100 via-slate-50 to-indigo-50/50 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-6 font-['Plus_Jakarta_Sans',sans-serif] selection:bg-indigo-500 selection:text-white antialiased transition-colors duration-300 relative">
  
  <!-- App Open Animated Loader Overlay with Safe Auto-Dismiss -->
  <aside id="appLoader" role="status" aria-live="polite" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-50/95 backdrop-blur-2xl transition-all duration-300 ease-out cursor-pointer" title="Click anywhere to skip">
    <div class="relative flex flex-col items-center pointer-events-none">
      <!-- Brand Symbol with Ambient Glowing Rings -->
      <div class="relative w-20 h-20 mb-5 flex items-center justify-center">
        <div class="absolute inset-0 rounded-3xl bg-gradient-to-tr from-indigo-500 to-cyan-400 blur-xl opacity-50 animate-pulse"></div>
        <div class="loader-outer-spinner absolute -inset-1.5 rounded-3xl border-2 border-indigo-200 border-t-indigo-600"></div>
        <div class="relative w-16 h-16 rounded-2xl bg-white shadow-xl flex items-center justify-center border border-slate-100/90 loader-badge-pulse">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center shadow-md shadow-indigo-500/25">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 7h6m0 10v-3m-6 3h.01M9 14h.01M15 11h.01M9 11h.01M4 5a1 1 0 011-1h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5z" />
            </svg>
          </div>
        </div>
      </div>
      
      <!-- Brand Title & Loading State -->
      <div class="text-center">
        <h1 class="text-lg font-extrabold tracking-tight text-slate-800 uppercase">Modern<span class="text-indigo-600">Calc</span></h1>
        <p id="loaderStatusText" class="text-xs font-semibold text-slate-500 mt-1 tracking-wider uppercase font-mono">Ready</p>
      </div>

      <!-- Linear Loading Bar Track -->
      <div class="w-48 h-1.5 bg-slate-200/80 rounded-full mt-4 overflow-hidden relative shadow-inner">
        <div id="loaderProgressBar" class="h-full bg-gradient-to-r from-indigo-600 via-indigo-500 to-cyan-500 rounded-full transition-all duration-200 w-1/2"></div>
      </div>
      <p class="text-[10px] text-slate-400 mt-3 font-mono opacity-60">Tap anywhere to launch</p>
    </div>
  </aside>

  <!-- Immediate Inline Failsafe Guard: Dismiss loader in max 500ms even if network lags -->
  <script>
    (function() {
      function dismissLoaderInstantly() {
        var loader = document.getElementById('appLoader');
        if (loader && !loader.classList.contains('loader-dismissed')) {
          loader.classList.add('loader-dismissed');
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.style.display = 'none';
            }
          }, 300);
        }
      }
      // Guarantee dismiss in at most 450ms
      setTimeout(dismissLoaderInstantly, 450);
      window.dismissLoaderInstantly = dismissLoaderInstantly;
    })();
  </script>

  <!-- Dynamic Ambient Background Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="ambient-glow absolute -top-32 -left-32 w-[32rem] h-[32rem] bg-indigo-300/35 rounded-full blur-3xl animate-pulse"></div>
    <div class="ambient-glow absolute top-1/2 -right-32 w-[30rem] h-[30rem] bg-sky-200/40 rounded-full blur-3xl"></div>
    <div class="ambient-glow absolute -bottom-32 left-1/4 w-[28rem] h-[28rem] bg-cyan-200/30 rounded-full blur-3xl"></div>
  </div>

  <!-- Calculator Container Frame -->
  <main class="w-full max-w-md sm:max-w-lg bg-white/95 backdrop-blur-2xl border border-slate-200/90 rounded-3xl shadow-2xl shadow-indigo-900/10 overflow-hidden flex flex-col relative transition-all duration-300" id="calcApp">
    
    <!-- Top Action Bar -->
    <header class="flex items-center justify-between px-6 pt-5 pb-3 border-b border-slate-100/90">
      <div class="flex items-center space-x-2.5">
        <div class="w-3.5 h-3.5 rounded-full bg-gradient-to-tr from-indigo-600 to-cyan-500 shadow-sm shadow-indigo-500/30"></div>
        <span class="font-bold tracking-tight text-sm uppercase text-slate-800">Modern<span class="text-indigo-600">Calc</span></span>
      </div>

      <!-- Action Toggles -->
      <div class="flex items-center space-x-1 sm:space-x-2">
        <!-- Sound Toggle -->
        <button id="soundToggle" type="button" aria-label="Toggle sound effects" title="Audio Feedback (M)" class="p-2 rounded-xl text-slate-500 hover:text-slate-800 hover:bg-slate-100 active:scale-95 transition">
          <svg id="soundIconOn" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
          <svg id="soundIconOff" class="w-4 h-4 hidden text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
          </svg>
        </button>

        <!-- Scientific Mode Toggle -->
        <button id="sciToggle" type="button" aria-label="Toggle Scientific Mode" title="Scientific Functions (S)" class="px-2.5 py-1 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-100 active:scale-95 transition flex items-center gap-1 shadow-2xs">
          <span>SCI</span>
        </button>

        <!-- Converter Mode Toggle -->
        <button id="convertToggle" type="button" aria-label="Toggle Unit Converter" title="Unit Converter (U)" class="px-2.5 py-1 text-xs font-semibold rounded-lg border border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-100 active:scale-95 transition flex items-center gap-1 shadow-2xs">
          <span>CONVERT</span>
        </button>

        <!-- History Drawer Button -->
        <button id="historyToggle" type="button" aria-label="Open calculation history" title="Calculation History (H)" class="p-2 rounded-xl text-slate-500 hover:text-slate-800 hover:bg-slate-100 active:scale-95 transition relative">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span id="historyBadge" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full bg-indigo-600 ring-2 ring-white"></span>
        </button>

        <!-- Theme Toggle (Light Default) -->
        <button id="themeToggle" type="button" aria-label="Toggle dark/light theme" class="p-2 rounded-xl text-slate-500 hover:text-slate-800 hover:bg-slate-100 active:scale-95 transition">
          <svg id="themeIconSun" class="w-4 h-4 text-amber-500 fill-amber-500/20" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg id="themeIconMoon" class="w-4 h-4 hidden text-indigo-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Display Screen -->
    <section class="calc-screen-panel px-6 py-5 flex flex-col justify-end bg-gradient-to-b from-slate-50/80 via-slate-100/70 to-slate-100/90 border-b border-slate-200/80 min-h-[148px] select-text relative">
      <div class="flex items-center justify-between text-[11px] font-medium text-slate-500 mb-1.5">
        <div class="flex items-center gap-2">
          <span id="memIndicator" class="hidden px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 border border-indigo-200 font-mono text-[10px] font-semibold">M</span>
          <button id="angleModeToggle" type="button" class="cursor-pointer font-bold tracking-wider text-[11px] px-2 py-0.5 rounded bg-slate-200/70 text-slate-700 hover:bg-slate-300/70 hover:text-slate-900 transition">DEG</button>
        </div>
        <div class="flex items-center gap-2">
          <span id="copyToast" class="opacity-0 transition-opacity text-emerald-600 font-semibold text-xs">Copied!</span>
          <button id="copyResultBtn" type="button" title="Copy result to clipboard" class="hover:text-indigo-600 text-slate-500 transition text-[11px] font-medium flex items-center gap-1 bg-white/80 px-2 py-0.5 rounded border border-slate-200/80 shadow-2xs">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span>Copy</span>
          </button>
        </div>
      </div>

      <!-- Expression History Line -->
      <div id="expressionDisplay" class="font-mono text-right text-slate-500 text-sm tracking-wide overflow-x-auto whitespace-nowrap min-h-[22px] scrollbar-none font-medium"></div>

      <!-- Main Result Display -->
      <div id="mainDisplay" class="font-mono font-bold text-right text-4xl sm:text-5xl text-slate-900 tracking-tight overflow-x-auto whitespace-nowrap scrollbar-none transition-all duration-150 py-1">0</div>
    </section>

    <!-- Unit Converter Section (Collapsible) -->
    <div id="converterDrawer" class="hidden p-4 bg-slate-50/95 border-b border-slate-200 transition-all duration-300">
      <div class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2.5 flex items-center justify-between">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          Unit Converter
        </span>
        <button id="closeConverterBtn" type="button" class="text-slate-400 hover:text-slate-700 text-base font-bold">&times;</button>
      </div>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="block text-[10px] uppercase text-slate-500 font-bold mb-1">Category</label>
          <select id="convCategory" class="w-full bg-white border border-slate-300 text-slate-800 text-xs rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none shadow-2xs font-medium">
            <option value="length">Length</option>
            <option value="mass">Mass / Weight</option>
            <option value="temp">Temperature</option>
            <option value="data">Digital Storage</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] uppercase text-slate-500 font-bold mb-1">Value</label>
          <input type="number" id="convInputValue" value="1" step="any" class="w-full bg-white border border-slate-300 text-slate-800 text-xs rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-mono font-semibold shadow-2xs">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="block text-[10px] uppercase text-slate-500 font-bold mb-1">From</label>
          <select id="convFromUnit" class="w-full bg-white border border-slate-300 text-slate-800 text-xs rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none shadow-2xs font-medium"></select>
        </div>
        <div>
          <label class="block text-[10px] uppercase text-slate-500 font-bold mb-1">To</label>
          <select id="convToUnit" class="w-full bg-white border border-slate-300 text-slate-800 text-xs rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none shadow-2xs font-medium"></select>
        </div>
      </div>
      <div class="p-3 rounded-xl bg-indigo-50/80 border border-indigo-100 flex items-center justify-between font-mono">
        <span class="text-xs text-indigo-700 font-semibold">Converted Result:</span>
        <span id="convOutputValue" class="text-indigo-950 font-bold text-base tracking-wide">1</span>
      </div>
    </div>

    <!-- Scientific Function Panel (Collapsible) -->
    <div id="sciDrawer" class="hidden grid grid-cols-5 gap-1.5 p-3.5 bg-slate-100/70 border-b border-slate-200/80 transition-all">
      <button type="button" data-action="sci" data-val="sin" class="calc-btn-sci">sin</button>
      <button type="button" data-action="sci" data-val="cos" class="calc-btn-sci">cos</button>
      <button type="button" data-action="sci" data-val="tan" class="calc-btn-sci">tan</button>
      <button type="button" data-action="sci" data-val="ln" class="calc-btn-sci">ln</button>
      <button type="button" data-action="sci" data-val="log" class="calc-btn-sci">log</button>

      <button type="button" data-action="sci" data-val="asin" class="calc-btn-sci text-[11px]">sin⁻¹</button>
      <button type="button" data-action="sci" data-val="acos" class="calc-btn-sci text-[11px]">cos⁻¹</button>
      <button type="button" data-action="sci" data-val="atan" class="calc-btn-sci text-[11px]">tan⁻¹</button>
      <button type="button" data-action="sci" data-val="sqrt" class="calc-btn-sci">√x</button>
      <button type="button" data-action="sci" data-val="sq" class="calc-btn-sci">x²</button>

      <button type="button" data-action="insert" data-val="^" class="calc-btn-sci">xʸ</button>
      <button type="button" data-action="sci" data-val="fact" class="calc-btn-sci">x!</button>
      <button type="button" data-action="insert" data-val="π" class="calc-btn-sci font-serif text-sm">π</button>
      <button type="button" data-action="insert" data-val="e" class="calc-btn-sci font-serif text-sm">e</button>
      <button type="button" data-action="sci" data-val="inv" class="calc-btn-sci">1/x</button>
    </div>

    <!-- Memory Function Bar -->
    <div class="grid grid-cols-5 gap-1.5 px-4 pt-3.5 pb-1 text-xs">
      <button type="button" data-action="mem" data-val="MC" class="calc-btn-mem">MC</button>
      <button type="button" data-action="mem" data-val="MR" class="calc-btn-mem">MR</button>
      <button type="button" data-action="mem" data-val="M+" class="calc-btn-mem">M+</button>
      <button type="button" data-action="mem" data-val="M-" class="calc-btn-mem">M-</button>
      <button type="button" data-action="mem" data-val="MS" class="calc-btn-mem">MS</button>
    </div>

    <!-- Standard Keypad -->
    <div class="grid grid-cols-4 gap-2.5 p-4 sm:p-5 flex-1 select-none">
      <button type="button" data-action="clear-all" class="calc-btn calc-btn-func text-rose-600 hover:text-rose-700 font-bold">AC</button>
      <button type="button" data-action="backspace" class="calc-btn calc-btn-func" aria-label="Delete last digit">
        <svg class="w-5 h-5 mx-auto text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414A2 2 0 0110.828 5H19a2 2 0 012 2v10a2 2 0 01-2 2h-8.172a2 2 0 01-1.414-.586L3 12z"/></svg>
      </button>
      <button type="button" data-action="bracket" class="calc-btn calc-btn-func font-mono">( )</button>
      <button type="button" data-action="op" data-val="÷" class="calc-btn calc-btn-operator">÷</button>

      <button type="button" data-action="num" data-val="7" class="calc-btn calc-btn-num">7</button>
      <button type="button" data-action="num" data-val="8" class="calc-btn calc-btn-num">8</button>
      <button type="button" data-action="num" data-val="9" class="calc-btn calc-btn-num">9</button>
      <button type="button" data-action="op" data-val="×" class="calc-btn calc-btn-operator">×</button>

      <button type="button" data-action="num" data-val="4" class="calc-btn calc-btn-num">4</button>
      <button type="button" data-action="num" data-val="5" class="calc-btn calc-btn-num">5</button>
      <button type="button" data-action="num" data-val="6" class="calc-btn calc-btn-num">6</button>
      <button type="button" data-action="op" data-val="-" class="calc-btn calc-btn-operator">−</button>

      <button type="button" data-action="num" data-val="1" class="calc-btn calc-btn-num">1</button>
      <button type="button" data-action="num" data-val="2" class="calc-btn calc-btn-num">2</button>
      <button type="button" data-action="num" data-val="3" class="calc-btn calc-btn-num">3</button>
      <button type="button" data-action="op" data-val="+" class="calc-btn calc-btn-operator">+</button>

      <button type="button" data-action="negate" class="calc-btn calc-btn-num text-slate-700">±</button>
      <button type="button" data-action="num" data-val="0" class="calc-btn calc-btn-num">0</button>
      <button type="button" data-action="decimal" class="calc-btn calc-btn-num font-bold">.</button>
      <button type="button" data-action="equals" class="calc-btn calc-btn-equals">=</button>
    </div>

    <!-- Slide-in History Drawer Overlay -->
    <div id="historyDrawer" class="absolute inset-0 bg-white/95 backdrop-blur-2xl z-20 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span class="font-bold text-sm tracking-tight text-slate-900">Calculation History</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="clearHistoryBtn" type="button" class="text-xs text-rose-600 hover:text-rose-700 font-semibold transition px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 border border-rose-200">Clear All</button>
          <button id="closeHistoryBtn" type="button" class="text-slate-400 hover:text-slate-700 p-1 text-xl leading-none">&times;</button>
        </div>
      </div>
      <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-2.5">
        <div class="text-center py-12 text-slate-400 text-xs">No previous calculations in this session.</div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
