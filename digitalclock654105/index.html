<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Inter', sans-serif;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-800 to-purple-900 min-h-screen flex items-center justify-center text-white p-4">
    <div class="bg-gray-900 bg-opacity-70 backdrop-blur-md rounded-xl shadow-2xl p-8 md:p-12 w-full max-w-lg text-center transform transition-all duration-300 hover:scale-105 border border-indigo-700">
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-6 tracking-tight">
            Digital Clock
        </h1>
        <div id="clock-display" class="font-mono text-center mb-8">
            <div id="time" class="text-7xl md:text-8xl font-bold text-green-400 drop-shadow-lg mb-2 select-none">
                00:00:00
            </div>
            <div id="date" class="text-2xl md:text-3xl font-light text-indigo-300 select-none">
                Monday, Jan 01 2024
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
