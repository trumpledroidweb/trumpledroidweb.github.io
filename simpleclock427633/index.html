<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Clock</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="flex flex-col items-center justify-center p-8 bg-gray-800 rounded-lg shadow-xl">
        <h1 class="text-4xl md:text-6xl font-extrabold mb-4">Current Time</h1>
        <div id="clock-display" class="text-6xl md:text-8xl font-mono tracking-wider text-green-400">
            --:--:--
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
