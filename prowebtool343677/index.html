<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProWebTool – Text Utility</title>
  <!-- Tailwind CSS v4 (browser) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 shadow">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-semibold">ProWebTool</h1>
      <button id="themeToggle" aria-label="Toggle dark mode" class="p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700">
        <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m8.66-11.66l-.71.71M4.05 19.95l-.71-.71M21 12h-1M4 12H3m15.66 6.34l-.71-.71M4.05 4.05l-.71.71" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-6">
    <section class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 space-y-4">
      <h2 class="text-xl font-medium">Text Analyzer & Transformer</h2>

      <!-- Text Input -->
      <div class="flex flex-col space-y-2">
        <label for="textInput" class="font-medium">Enter your text</label>
        <textarea id="textInput" rows="6"
                  class="border border-gray-300 dark:border-gray-600 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-700"
                  placeholder="Type or paste text here..."
                  aria-describedby="charCount"></textarea>
        <div id="charCount" class="text-sm text-gray-600 dark:text-gray-400 text-right">0 characters</div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap gap-2">
        <button id="analyzeBtn" class="btn-primary flex-1 min-w-[120px]">Analyze</button>
        <button id="uppercaseBtn" class="btn-secondary flex-1 min-w-[120px]">Uppercase</button>
        <button id="lowercaseBtn" class="btn-secondary flex-1 min-w-[120px]">Lowercase</button>
        <button id="reverseBtn" class="btn-secondary flex-1 min-w-[120px]">Reverse</button>
        <button id="copyBtn" class="btn-outline flex-1 min-w-[120px]">Copy Result</button>
        <button id="downloadBtn" class="btn-outline flex-1 min-w-[120px]">Download Result</button>
        <button id="resetBtn" class="btn-danger flex-1 min-w-[120px]">Reset</button>
      </div>

      <!-- Result Area -->
      <div id="resultSection" class="mt-4 hidden">
        <h3 class="font-medium mb-2">Result</h3>
        <div id="analysis" class="space-y-1 text-sm text-gray-700 dark:text-gray-300">
          <p id="wordCount"></p>
          <p id="charCountResult"></p>
          <p id="readingTime"></p>
        </div>
        <textarea id="resultOutput" rows="6" readonly
                  class="mt-2 w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none"></textarea>
        <p id="message" class="mt-2 text-sm"></p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-gray-800 py-4">
    <div class="max-w-4xl mx-auto text-center text-sm text-gray-600 dark:text-gray-400">
      © <span id="year"></span> Pro
